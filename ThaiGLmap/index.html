<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>泰百圣地巡礼打卡地图</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preconnect" href="https://basemaps.cartocdn.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <style>
    :root {
      color-scheme: light;
      --ink: #18201d;
      --muted: #65706c;
      --paper: #fffdfa;
      --soft: #f2f5f1;
      --line: #dce3de;
      --shadow: 0 16px 38px rgba(28, 42, 35, .16);
      --green: #23795a;
      --focus: #146cc4;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: var(--paper);
      letter-spacing: 0;
    }

    body { overflow: hidden; }
    button, input { font: inherit; }
    button { cursor: pointer; }

    .app {
      display: grid;
      grid-template-columns: 430px minmax(0, 1fr);
      height: 100vh;
      min-height: 100vh;
    }

    .sidebar {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--line);
      background: #fffdfa;
      z-index: 2;
    }

    .brand {
      padding: 15px 18px 12px;
      border-bottom: 1px solid var(--line);
    }

    .brand h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.15;
      font-weight: 850;
    }

    .brand p {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .controls {
      display: grid;
      gap: 12px;
      padding: 14px;
      border-bottom: 1px solid var(--line);
      background: #f8faf6;
    }

    .search {
      width: 100%;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: white;
      color: var(--ink);
      padding: 0 12px;
      outline: none;
    }

    .search:focus {
      border-color: var(--focus);
      box-shadow: 0 0 0 3px rgba(20, 108, 196, .16);
    }

    .series-strip {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .series-button {
      position: relative;
      width: 132px;
      min-width: 132px;
      height: 178px;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      color: white;
      background: #1f2a26;
      padding: 0;
      text-align: left;
      box-shadow: 0 8px 18px rgba(28, 42, 35, .12);
    }

    .series-button[aria-pressed="true"] {
      border-color: var(--series-color);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--series-color) 26%, transparent), 0 10px 22px rgba(28, 42, 35, .18);
    }

    .series-button img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: .82;
    }

    .series-button::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0, 0, 0, .02), rgba(0, 0, 0, .72));
      pointer-events: none;
    }

    .series-button span {
      position: absolute;
      left: 9px;
      right: 9px;
      bottom: 9px;
      z-index: 1;
      font-size: 13px;
      font-weight: 850;
      line-height: 1.22;
      text-shadow: 0 2px 10px rgba(0, 0, 0, .65);
    }

    .filter-summary {
      display: grid;
      grid-template-columns: 54px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      border: 1px solid var(--line);
      border-left: 5px solid var(--series-color);
      border-radius: 8px;
      background: white;
      padding: 8px;
      box-shadow: 0 6px 14px rgba(28, 42, 35, .08);
    }

    .filter-summary img {
      width: 54px;
      height: 72px;
      object-fit: cover;
      border-radius: 6px;
      background: var(--soft);
    }

    .filter-summary strong {
      display: block;
      font-size: 15px;
      line-height: 1.25;
    }

    .filter-summary span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .summary-actions {
      display: flex;
      gap: 7px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .mini-btn {
      min-height: 30px;
      border-radius: 8px;
      border: 1px solid var(--series-color);
      background: white;
      color: var(--series-color);
      padding: 0 9px;
      font-size: 12px;
      font-weight: 800;
    }

    .mini-btn.primary {
      background: var(--series-color);
      color: white;
    }

    .list {
      min-height: 0;
      overflow: auto;
      display: grid;
      align-content: start;
      grid-auto-rows: max-content;
      gap: 12px;
      padding: 14px;
    }

    .spot {
      border: 1px solid var(--line);
      border-left: 5px solid var(--spot-color);
      border-radius: 8px;
      background: white;
      box-shadow: 0 8px 20px rgba(28, 42, 35, .08);
      overflow: hidden;
    }

    .spot.active {
      border-color: var(--spot-color);
      box-shadow: var(--shadow);
    }

    .spot-main {
      padding: 13px;
      display: grid;
      gap: 10px;
    }

    .spot-head {
      display: grid;
      gap: 5px;
    }

    .spot .series-name {
      color: var(--spot-color);
      font-size: 13px;
      font-weight: 850;
    }

    .spot h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.25;
    }

    .address {
      margin: 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
    }

    .gallery {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
      scroll-snap-type: x proximity;
    }

    .scene-thumb {
      flex: 0 0 184px;
      height: 126px;
      border: 0;
      border-radius: 8px;
      background: var(--soft);
      padding: 0;
      overflow: hidden;
      scroll-snap-align: start;
    }

    .scene-thumb:first-child {
      flex-basis: 224px;
      height: 146px;
    }

    .scene-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .btn {
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      border: 1px solid var(--spot-color);
      background: var(--spot-color);
      color: white;
      padding: 0 12px;
      font-size: 13px;
      font-weight: 850;
      text-decoration: none;
    }

    .btn.secondary {
      background: white;
      color: var(--spot-color);
    }

    .controls {
      gap: 8px;
      padding: 12px 14px;
    }

    .search {
      height: 46px;
      border: 2px solid #111a3a;
      border-radius: 8px;
      padding: 0 12px 0 40px;
      font-size: 17px;
      background-color: white;
      background-image: radial-gradient(circle at 17px 20px, transparent 0 8px, #07143a 8px 10px, transparent 10px), linear-gradient(45deg, transparent 0 22px, #07143a 22px 25px, transparent 25px);
      background-repeat: no-repeat;
    }

    .list {
      gap: 8px;
      padding: 10px 12px 14px;
    }

    .series-list {
      display: grid;
      gap: 7px;
    }

    .series-row {
      width: 100%;
      min-height: 72px;
      display: grid;
      grid-template-columns: 50px minmax(0, 1fr) 18px;
      gap: 10px;
      align-items: center;
      border: 1px solid transparent;
      border-radius: 8px;
      background: white;
      padding: 6px 8px;
      color: var(--ink);
      text-align: left;
    }

    .series-row:hover,
    .series-row:focus-visible {
      border-color: var(--series-color);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--series-color) 18%, transparent);
      outline: none;
    }

    .series-poster {
      width: 46px;
      height: 58px;
      object-fit: cover;
      border-radius: 5px;
      background: var(--soft);
      display: block;
    }

    .series-row h2 {
      margin: 0;
      font-size: 16px;
      line-height: 1.18;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .series-row .en {
      display: block;
      margin-top: 2px;
      color: #243552;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .series-row .meta-line {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.25;
    }

    .series-dot {
      width: 18px;
      height: 18px;
      border-radius: 999px;
      background: var(--series-color);
    }

    .section-hint {
      padding: 4px 2px 2px;
      color: var(--muted);
      font-size: 12px;
    }

    .spot {
      box-shadow: 0 4px 12px rgba(28, 42, 35, .06);
    }

    .spot-main {
      padding: 6px;
      grid-template-columns: minmax(0, 1fr);
      gap: 4px;
      align-items: start;
    }

    .spot-head {
      gap: 3px;
    }

    .spot h2 {
      font-size: 13px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .address {
      font-size: 9.5px;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .gallery {
      gap: 5px;
      padding: 0 0 2px;
      grid-row: 2;
    }

    .scene-thumb {
      flex: 0 0 66px;
      height: 44px;
      border-radius: 6px;
    }

    .scene-thumb:first-child {
      flex-basis: 66px;
      height: 44px;
    }

    .spot-details {
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 3px 6px;
      align-items: center;
      grid-row: 1;
    }

    .spot-details .address {
      grid-column: 1 / -1;
    }

    .actions {
      gap: 5px;
    }

    .btn {
      min-height: 28px;
      padding: 0 8px;
      font-size: 11px;
    }

    .map-shell {
      position: relative;
      min-width: 0;
      min-height: 0;
      height: 100vh;
    }

    #map {
      position: absolute;
      inset: 0;
      background: #e8eee9;
    }

    .map-credit {
      position: absolute;
      left: 16px;
      bottom: 16px;
      z-index: 500;
      max-width: 560px;
      border: 1px solid rgba(219, 226, 220, .95);
      border-radius: 8px;
      background: rgba(255, 253, 250, .94);
      box-shadow: 0 10px 24px rgba(28, 42, 35, .12);
      padding: 10px 12px;
      color: #3d4945;
      font-size: 12px;
      line-height: 1.45;
      backdrop-filter: blur(8px);
    }

    .map-credit a {
      color: var(--green);
      font-weight: 850;
      text-decoration: none;
    }

    .marker {
      width: 30px;
      height: 30px;
      border-radius: 999px 999px 999px 4px;
      transform: rotate(-45deg);
      border: 3px solid white;
      background: var(--marker-color);
      box-shadow: 0 8px 20px rgba(28, 42, 35, .28);
    }

    .marker span {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      color: white;
      font-size: 12px;
      font-weight: 850;
      transform: rotate(45deg);
    }

    .leaflet-popup-content-wrapper {
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .leaflet-popup-content { margin: 10px; }

    .popup {
      width: 248px;
      display: grid;
      gap: 8px;
    }

    .popup button {
      border: 0;
      border-radius: 6px;
      padding: 0;
      overflow: hidden;
      background: var(--soft);
    }

    .popup img {
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      display: block;
    }

    .popup strong {
      font-size: 15px;
      line-height: 1.3;
    }

    .popup span {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .popup a {
      color: var(--green);
      font-weight: 850;
      text-decoration: none;
    }

    .empty {
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: #fbfcfa;
      color: var(--muted);
      padding: 18px;
      font-size: 14px;
    }

    .lightbox[hidden] { display: none; }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: grid;
      place-items: center;
      background: rgba(12, 17, 15, .78);
      padding: 20px;
    }

    .lightbox-panel {
      position: relative;
      width: min(980px, 100%);
      max-height: 92vh;
      display: grid;
      gap: 10px;
    }

    .lightbox-image {
      width: 100%;
      max-height: 78vh;
      object-fit: contain;
      border-radius: 8px;
      background: #0f1512;
      box-shadow: 0 20px 54px rgba(0, 0, 0, .42);
    }

    .lightbox-caption {
      min-height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: white;
      font-size: 14px;
      text-align: center;
    }

    .lightbox-close,
    .lightbox-nav {
      position: absolute;
      border: 1px solid rgba(255, 255, 255, .35);
      background: rgba(255, 255, 255, .92);
      color: #101613;
      box-shadow: 0 10px 24px rgba(0, 0, 0, .26);
    }

    .lightbox-close {
      top: -12px;
      right: -12px;
      width: 38px;
      height: 38px;
      border-radius: 999px;
      font-size: 20px;
      line-height: 1;
    }

    .lightbox-nav {
      top: 45%;
      width: 42px;
      height: 54px;
      border-radius: 8px;
      font-size: 28px;
      line-height: 1;
    }

    .lightbox-prev { left: -12px; }
    .lightbox-next { right: -12px; }

    @media (max-width: 860px) {
      body { overflow: auto; }

      .app {
        display: flex;
        flex-direction: column;
        height: auto;
        min-height: 100vh;
      }

      .map-shell {
        height: 38vh;
        min-height: 300px;
      }

      .sidebar {
        border-right: 0;
        border-top: 1px solid var(--line);
      }

      .list { overflow: visible; }

      .scene-thumb {
        flex-basis: 66px;
        height: 44px;
      }

      .scene-thumb:first-child {
        flex-basis: 66px;
        height: 44px;
      }

      .spot-main {
        grid-template-columns: minmax(0, 1fr);
      }

      .map-credit {
        left: 10px;
        right: 10px;
        bottom: 10px;
        max-width: none;
      }

      .lightbox {
        padding: 12px;
      }

      .lightbox-nav {
        top: auto;
        bottom: 48px;
      }

      .lightbox-prev { left: 16px; }
      .lightbox-next { right: 16px; }
    }
  </style>
</head>

 10100, Thailand", "lat": 13.7597, "lng": 100.51212, "maps": "https://www.google.com/maps/search/?api=1&query=Opposite+Nangloeng+Market+Bus+stop+Wat+Sommanat%2C+Pom+Prap+Sattru+Phai%2C+Bangkok+10100%2C+Thailand", "images": ["assets/scenes/us/054-pasted-image-20260622093046.webp", "assets/scenes/us/055-pasted-image-20260622093144.webp"]}, {"id": "us-05", "seriesKey": "US", "seriesSlug": "us", "seriesTitle": "US 我们的爱", "color": "#e85d75", "title": "Opposite Office of the National Economic and Social Development Council", "address": "ตรงข้ามสภาพัฒน์\nBus stopWat Sommanat, Pom Prap Sattru Phai, Bangkok 10100, Thailand", "lat": 13.7581082, "lng": 100.5147647, "maps": "https://www.google.com/maps/search/?api=1&query=Opposite+Office+of+the+National+Economic+and+Social+Development+Council+%E0%B8%95%E0%B8%A3%E0%B8%87%E0%B8%82%E0%B9%89%E0%B8%B2%E0%B8%A1%E0%B8%AA%E0%B8%A0%E0%B8%B2%E0%B8%9E%E0%B8%B1%E0%B8%92%E0%B8%99%E0%B9%8C%0ABus+stopWat+Sommanat%2C+Pom+Prap+Sattru+Phai%2C+Bangkok+10100%2C+Thailand", "images": ["assets/scenes/us/056-pasted-image-20260622093239.webp", "assets/scenes/us/057-pasted-image-20260622093120.webp"]}, {"id": "us-06", "seriesKey": "US", "seriesSlug": "us", "seriesTitle": "US 我们的爱", "color": "#e85d75", "title": "Aree Mansion อารีย์ แมนชั่น", "address": "39 Sukhumvit 26, Khlong Tan, Khlong Toei, Bangkok 10110", "lat": 13.7272898, "lng": 100.57006, "maps": "https://www.google.com/maps/search/?api=1&query=Aree+Mansion+%E0%B8%AD%E0%B8%B2%E0%B8%A3%E0%B8%B5%E0%B8%A2%E0%B9%8C+%E0%B9%81%E0%B8%A1%E0%B8%99%E0%B8%8A%E0%B8%B1%E0%B9%88%E0%B8%99+39+Sukhumvit+26%2C+Khlong+Tan%2C+Khlong+Toei%2C+Bangkok+10110", "images": ["assets/scenes/us/058-pasted-image-20260622143507.webp", "assets/scenes/us/059-pasted-image-20260622143522.webp", "assets/scenes/us/060-pasted-image-20260622094657.webp", "assets/scenes/us/061-pasted-image-20260622094720.webp"]}, {"id": "whale-store-01", "seriesKey": "Whale Store", "seriesSlug": "whale-store", "seriesTitle": "Whale Store 鲸鱼杂货铺", "color": "#2f9c95", "title": "2425 Soi Borommabanphot", "address": "2425 Soi Borommabanphot, Khwaeng Ban Bat, Khet Pom Prap Sattru Phai, Krung Thep Maha Nakhon 10100, Thailand", "lat": 13.7543129, "lng": 100.5083609, "maps": "https://www.google.com/maps/search/?api=1&query=2425+Soi+Borommabanphot+2425+Soi+Borommabanphot%2C+Khwaeng+Ban+Bat%2C+Khet+Pom+Prap+Sattru+Phai%2C+Krung+Thep+Maha+Nakhon+10100%2C+Thailand", "images": ["assets/scenes/whale-store/062-pasted-image-20260622113824.webp", "assets/scenes/whale-store/063-pasted-image-20260622113838.webp"]}]};
    const allSeriesKey = "__all__";
    let activeSeries = allSeriesKey;
    let activeSpot = null;
    let lightboxSpot = null;
    let lightboxIndex = 0;
    let touchStartX = 0;
    const markers = new Map();

    const seriesArea = document.querySelector("#seriesArea");
    const spotList = document.querySelector("#spotList");
    const search = document.querySelector("#search");
    const lightbox = document.querySelector("#lightbox");
    const lightboxImage = document.querySelector("#lightboxImage");
    const lightboxCaption = document.querySelector("#lightboxCaption");

    const map = L.map("map", { zoomControl: false }).setView([13.745, 100.54], 11);
    L.control.zoom({ position: "bottomright" }).addTo(map);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
      subdomains: "abcd",
      maxZoom: 20,
      attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
    }).addTo(map);

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char]));
    }

    function posterFallback(seriesKey) {
      const spot = appData.spots.find((item) => item.seriesKey === seriesKey && item.images.length);
      return spot?.images[0] ?? "";
    }

    function selectedSeries() {
      return appData.series.find((series) => series.key === activeSeries);
    }

    function renderSeries() {
      const selected = selectedSeries();
      if (selected) {
        seriesArea.innerHTML = `<div class="filter-summary" style="--series-color:${esc(selected.color)}">
          <img src="${esc(selected.poster || posterFallback(selected.key))}" alt="${esc(selected.title)} 封面">
          <div>
            <strong>${esc(selected.zh)}</strong>
            <span>${esc(selected.en)} · ${esc(selected.release)} · ${selected.count} 处</span>
            <div class="summary-actions">
              <button class="mini-btn primary" type="button" data-series="${allSeriesKey}">返回剧名列表</button>
            </div>
          </div>
        </div>`;
        return;
      }
      seriesArea.innerHTML = "";
    }

    function filteredSpots() {
      const term = search.value.trim().toLowerCase();
      return appData.spots.filter((spot) => {
        if (activeSeries !== allSeriesKey && spot.seriesKey !== activeSeries) return false;
        if (activeSeries === allSeriesKey) return true;
        if (!term) return true;
        const text = `${spot.seriesTitle} ${spot.title} ${spot.address}`.toLowerCase();
        return text.includes(term);
      });
    }

    function filteredSeries() {
      const term = search.value.trim().toLowerCase();
      if (!term) return appData.series;
      return appData.series.filter((series) => {
        const text = `${series.title} ${series.en} ${series.zh} ${series.original} ${series.release}`.toLowerCase();
        return text.includes(term);
      });
    }

    function seriesRows() {
      const data = filteredSeries();
      if (!data.length) return `<div class="empty">没有匹配的剧名</div>`;
      return `<div class="section-hint">选择剧名后查看地点</div><div class="series-list">${data.map((series) => `<button class="series-row" type="button" data-series="${esc(series.key)}" style="--series-color:${esc(series.color)};">
        <img class="series-poster" src="${esc(series.poster || posterFallback(series.key))}" alt="${esc(series.title)} 封面" onerror="this.src='${esc(posterFallback(series.key))}'">
        <span>
          <h2>${esc(series.zh)}</h2>
          <span class="en">${esc(series.en)}</span>
          <span class="meta-line"><span>${esc(series.release)}</span><span>·</span><span>${series.count} Spots</span></span>
        </span>
        <span class="series-dot" aria-hidden="true"></span>
      </button>`).join("")}</div>`;
    }

    function gallery(spot) {
      return spot.images.map((src, index) => `<button class="scene-thumb" type="button" data-gallery="${esc(spot.id)}" data-index="${index}" aria-label="查看第 ${index + 1} 张剧照">
        <img src="${esc(src)}" alt="剧中场景">
      </button>`).join("");
    }

    function renderList() {
      if (activeSeries === allSeriesKey) {
        spotList.innerHTML = seriesRows();
        return;
      }
      const data = filteredSpots();
      if (!data.length) {
        spotList.innerHTML = `<div class="empty">没有匹配的地点</div>`;
        return;
      }
      spotList.innerHTML = data.map((spot) => `<article class="spot ${spot.id === activeSpot ? "active" : ""}" data-spot="${esc(spot.id)}" style="--spot-color:${esc(spot.color)}">
        <div class="spot-main">
          <div class="gallery">${gallery(spot)}</div>
          <div class="spot-details">
            <div class="spot-head">
              <h2>${esc(spot.title)}</h2>
            </div>
            <p class="address">${esc(spot.address).replace(/\n/g, "<br>")}</p>
            <div class="actions">
              <button class="btn secondary" type="button" data-focus="${esc(spot.id)}">定位</button>
              <a class="btn" href="${esc(spot.maps)}" target="_blank" rel="noreferrer">Google</a>
            </div>
          </div>
        </div>
      </article>`).join("");
    }

    function popupHtml(spot) {
      const image = spot.images[0] ?? "";
      return `<div class="popup">
        <button type="button" data-gallery="${esc(spot.id)}" data-index="0" aria-label="查看剧照">
          <img src="${esc(image)}" alt="${esc(spot.title)}">
        </button>
        <strong>${esc(spot.title)}</strong>
        <span>${esc(spot.seriesTitle)} · ${spot.images.length} 张图</span>
        <a href="${esc(spot.maps)}" target="_blank" rel="noreferrer">Google Maps</a>
      </div>`;
    }

    function renderMarkers() {
      appData.spots.forEach((spot, index) => {
        const icon = L.divIcon({
          className: "",
          html: `<div class="marker" style="--marker-color:${esc(spot.color)}"><span>${index + 1}</span></div>`,
          iconSize: [30, 30],
          iconAnchor: [15, 28],
          popupAnchor: [0, -24]
        });
        const marker = L.marker([spot.lat, spot.lng], { icon }).addTo(map).bindPopup(popupHtml(spot));
        marker.on("click", () => selectSpot(spot.id, false));
        markers.set(spot.id, marker);
      });
      updateMarkerVisibility();
      fitVisibleMarkers();
    }

    function updateMarkerVisibility() {
      const visibleIds = new Set(filteredSpots().map((spot) => spot.id));
      appData.spots.forEach((spot) => {
        const marker = markers.get(spot.id);
        if (!marker) return;
        if (visibleIds.has(spot.id)) {
          if (!map.hasLayer(marker)) marker.addTo(map);
        } else if (map.hasLayer(marker)) {
          marker.remove();
        }
      });
    }

    function fitVisibleMarkers() {
      const data = filteredSpots();
      if (!data.length) return;
      updateMarkerVisibility();
      const group = L.featureGroup(data.map((spot) => markers.get(spot.id)).filter(Boolean));
      map.fitBounds(group.getBounds().pad(0.18));
    }

    function selectSpot(id, openPopup = true) {
      const spot = appData.spots.find((item) => item.id === id);
      if (!spot) return;
      activeSpot = id;
      renderList();
      map.flyTo([spot.lat, spot.lng], Math.max(map.getZoom(), 15), { duration: 0.65 });
      if (openPopup) markers.get(id)?.openPopup();
      document.querySelector(`[data-spot="${CSS.escape(id)}"]`)?.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }

    function openLightbox(spotId, index) {
      const spot = appData.spots.find((item) => item.id === spotId);
      if (!spot || !spot.images.length) return;
      lightboxSpot = spot;
      lightboxIndex = Number(index) || 0;
      updateLightbox();
      lightbox.hidden = false;
    }

    function updateLightbox() {
      if (!lightboxSpot) return;
      const total = lightboxSpot.images.length;
      lightboxIndex = (lightboxIndex + total) % total;
      lightboxImage.src = lightboxSpot.images[lightboxIndex];
      lightboxCaption.textContent = `${lightboxSpot.seriesTitle} · ${lightboxSpot.title} · ${lightboxIndex + 1} / ${total}`;
    }

    function closeLightbox() {
      lightbox.hidden = true;
      lightboxSpot = null;
      lightboxImage.removeAttribute("src");
    }

    function shiftLightbox(delta) {
      if (!lightboxSpot) return;
      lightboxIndex += delta;
      updateLightbox();
    }

    seriesArea.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-series]");
      if (!button) return;
      activeSeries = button.dataset.series;
      activeSpot = null;
      search.value = "";
      renderSeries();
      renderList();
      fitVisibleMarkers();
    });

    spotList.addEventListener("click", (event) => {
      const seriesButton = event.target.closest(".series-row[data-series]");
      if (seriesButton) {
        activeSeries = seriesButton.dataset.series;
        activeSpot = null;
        search.value = "";
        renderSeries();
        renderList();
        fitVisibleMarkers();
        return;
      }
      const galleryButton = event.target.closest("[data-gallery]");
      if (galleryButton) {
        openLightbox(galleryButton.dataset.gallery, galleryButton.dataset.index);
        return;
      }
      const focus = event.target.closest("[data-focus]");
      if (focus) {
        selectSpot(focus.dataset.focus);
        return;
      }
      const card = event.target.closest("[data-spot]");
      if (card && !event.target.closest("a")) selectSpot(card.dataset.spot);
    });

    document.addEventListener("click", (event) => {
      const galleryButton = event.target.closest(".leaflet-popup [data-gallery]");
      if (galleryButton) openLightbox(galleryButton.dataset.gallery, galleryButton.dataset.index);
    });

    search.addEventListener("input", () => {
      renderList();
      fitVisibleMarkers();
    });

    document.querySelector("#lightboxClose").addEventListener("click", closeLightbox);
    document.querySelector("#lightboxPrev").addEventListener("click", () => shiftLightbox(-1));
    document.querySelector("#lightboxNext").addEventListener("click", () => shiftLightbox(1));
    lightbox.addEventListener("click", (event) => {
      if (event.target === lightbox) closeLightbox();
    });
    lightbox.addEventListener("touchstart", (event) => {
      touchStartX = event.changedTouches[0]?.clientX ?? 0;
    }, { passive: true });
    lightbox.addEventListener("touchend", (event) => {
      const endX = event.changedTouches[0]?.clientX ?? touchStartX;
      const delta = endX - touchStartX;
      if (Math.abs(delta) > 42) shiftLightbox(delta > 0 ? -1 : 1);
    }, { passive: true });
    document.addEventListener("keydown", (event) => {
      if (lightbox.hidden) return;
      if (event.key === "Escape") closeLightbox();
      if (event.key === "ArrowLeft") shiftLightbox(-1);
      if (event.key === "ArrowRight") shiftLightbox(1);
    });

    renderSeries();
    renderList();
    renderMarkers();
    if (activeSpot) markers.get(activeSpot)?.openPopup();
  </script>
</body>
</html>
