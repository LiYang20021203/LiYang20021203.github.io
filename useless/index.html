<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>课题组人格测评</title>
    <meta
      name="description"
      content="围绕量子点、超净间、组会、文献、实验习惯和组内生活的课题组人格测评。"
    />
    <style>
:root {
  color-scheme: light;
  --ink: #1d2329;
  --muted: #66707a;
  --line: #dfe5ea;
  --paper: #f7f3eb;
  --panel: #fffdf8;
  --mint: #2d9c7b;
  --blue: #3764b7;
  --coral: #dc6b55;
  --gold: #b8872d;
  --shadow: 0 24px 70px rgba(31, 45, 61, 0.16);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    linear-gradient(135deg, rgba(45, 156, 123, 0.18), transparent 32%),
    linear-gradient(315deg, rgba(220, 107, 85, 0.16), transparent 36%),
    var(--paper);
  color: var(--ink);
  font-family:
    Inter, "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}

button {
  font: inherit;
}

.app-shell {
  width: min(1120px, calc(100% - 32px));
  min-height: 100vh;
  margin: 0 auto;
  display: grid;
  grid-template-columns: minmax(280px, 0.85fr) minmax(320px, 1.15fr);
  gap: 28px;
  align-items: center;
  padding: 34px 0;
}

.intro-panel,
.quiz-panel {
  border: 1px solid rgba(29, 35, 41, 0.1);
  background: rgba(255, 253, 248, 0.92);
  box-shadow: var(--shadow);
}

.intro-panel {
  min-height: 640px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 34px;
  overflow: hidden;
  position: relative;
}

.brand-row {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  color: var(--muted);
  font-size: 0.92rem;
  font-weight: 700;
}

.brand-mark {
  width: 42px;
  height: 42px;
  display: inline-grid;
  place-items: center;
  border: 2px solid var(--ink);
  background: var(--gold);
  color: #fff;
}

h1 {
  margin: 46px 0 16px;
  font-size: clamp(2.55rem, 7vw, 5.6rem);
  line-height: 0.95;
  letter-spacing: 0;
}

.lead {
  max-width: 34rem;
  color: #46505a;
  font-size: 1.08rem;
  line-height: 1.8;
}

.lab-visual {
  min-height: 270px;
  position: relative;
  margin: 24px 0;
  border: 1px solid rgba(29, 35, 41, 0.12);
  background:
    linear-gradient(90deg, rgba(29, 35, 41, 0.06) 1px, transparent 1px),
    linear-gradient(rgba(29, 35, 41, 0.06) 1px, transparent 1px),
    #f1f6f0;
  background-size: 28px 28px;
}

.bench {
  position: absolute;
  left: 9%;
  right: 9%;
  bottom: 48px;
  height: 28px;
  background: var(--ink);
}

.bench::after {
  content: "";
  position: absolute;
  left: -18px;
  right: -18px;
  top: 28px;
  height: 10px;
  background: var(--coral);
}

.flask {
  position: absolute;
  bottom: 28px;
  width: 54px;
  height: 92px;
  border: 3px solid var(--ink);
  background:
    linear-gradient(to top, rgba(45, 156, 123, 0.75) 42%, transparent 42%),
    rgba(255, 255, 255, 0.65);
  clip-path: polygon(36% 0, 64% 0, 64% 32%, 92% 100%, 8% 100%, 36% 32%);
}

.flask-a {
  left: 10%;
}

.flask-b {
  left: 31%;
  height: 118px;
  background:
    linear-gradient(to top, rgba(55, 100, 183, 0.72) 55%, transparent 55%),
    rgba(255, 255, 255, 0.65);
}

.screen {
  position: absolute;
  right: 8%;
  bottom: 28px;
  width: 146px;
  height: 110px;
  border: 3px solid var(--ink);
  background: #27313c;
  padding: 18px;
}

.screen i {
  display: block;
  height: 10px;
  margin-bottom: 13px;
  background: #74d3af;
}

.screen i:nth-child(2) {
  width: 72%;
  background: #f1c76b;
}

.screen i:nth-child(3) {
  width: 48%;
  background: #ef806b;
}

.chart {
  position: absolute;
  right: 12%;
  top: 28px;
  width: 134px;
  height: 92px;
  display: flex;
  gap: 10px;
  align-items: end;
  padding: 12px;
  border: 2px solid var(--ink);
  background: rgba(255, 253, 248, 0.86);
}

.chart span {
  flex: 1;
  background: var(--blue);
}

.chart span:nth-child(2) {
  background: var(--mint);
}

.chart span:nth-child(3) {
  background: var(--gold);
}

.chart span:nth-child(4) {
  background: var(--coral);
}

.quick-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.quick-stats span {
  min-width: 0;
  padding: 14px 12px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.58);
  color: var(--muted);
}

.quick-stats b {
  display: block;
  color: var(--ink);
  font-size: 1.35rem;
}

.quiz-panel {
  min-height: 640px;
  padding: clamp(22px, 4vw, 44px);
  display: flex;
  align-items: center;
}

#quiz-view,
.result-view {
  width: 100%;
}

.quiz-topline {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  color: var(--muted);
  font-size: 0.92rem;
  font-weight: 700;
}

.progress-track {
  height: 8px;
  margin: 18px 0 36px;
  background: #e6ecef;
  overflow: hidden;
}

.progress-track span {
  display: block;
  width: 10%;
  height: 100%;
  background: linear-gradient(90deg, var(--mint), var(--blue), var(--coral));
  transition: width 180ms ease;
}

h2 {
  margin: 0 0 26px;
  font-size: clamp(1.65rem, 3.5vw, 2.6rem);
  line-height: 1.18;
  letter-spacing: 0;
}

.option-list {
  display: grid;
  gap: 12px;
}

.option-button {
  width: 100%;
  min-height: 74px;
  border: 1px solid #d9e0e5;
  background: #fff;
  color: var(--ink);
  text-align: left;
  padding: 18px 18px;
  cursor: pointer;
  display: grid;
  grid-template-columns: 36px 1fr;
  gap: 14px;
  align-items: center;
  transition:
    transform 160ms ease,
    border-color 160ms ease,
    box-shadow 160ms ease;
}

.option-button:hover,
.option-button:focus-visible,
.option-button.selected {
  outline: none;
  transform: translateY(-2px);
  border-color: var(--blue);
  box-shadow: 0 12px 24px rgba(55, 100, 183, 0.14);
}

.option-button.selected {
  background: #eef5f1;
}

.option-key {
  width: 36px;
  height: 36px;
  display: inline-grid;
  place-items: center;
  background: #eef3f0;
  color: var(--mint);
  font-weight: 900;
}

.option-text {
  line-height: 1.55;
}

.quiz-actions {
  display: flex;
  justify-content: flex-start;
  margin-top: 18px;
}

.hidden {
  display: none;
}

.result-kicker {
  margin: 0 0 10px;
  color: var(--coral);
  font-weight: 800;
}

.result-summary {
  margin: -10px 0 22px;
  color: #46505a;
  font-size: 1.05rem;
  line-height: 1.75;
}

.result-detail {
  display: grid;
  gap: 10px;
  margin: 0 0 22px;
}

.result-detail p {
  margin: 0;
  padding: 12px 14px;
  border-left: 4px solid var(--mint);
  background: #f4f7f3;
  color: #46505a;
  line-height: 1.65;
}

.badge-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 24px;
}

.badge-list span {
  padding: 8px 11px;
  background: #eef5f1;
  color: #246f59;
  font-weight: 800;
  font-size: 0.88rem;
}

.score-grid {
  display: grid;
  gap: 14px;
  margin: 26px 0;
}

.score-row {
  display: grid;
  grid-template-columns: 86px 1fr;
  gap: 14px;
  align-items: center;
  color: var(--muted);
  font-weight: 700;
}

.score-line {
  height: 13px;
  background: #e7ecef;
  overflow: hidden;
}

.score-line i {
  display: block;
  width: 0;
  height: 100%;
  background: var(--blue);
  transition: width 360ms ease;
}

.action-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.primary-button,
.secondary-button,
.ghost-button {
  min-height: 46px;
  border: 1px solid var(--ink);
  padding: 0 18px;
  cursor: pointer;
  font-weight: 900;
}

.primary-button {
  background: var(--ink);
  color: #fff;
}

.secondary-button {
  background: #fff;
  color: var(--ink);
}

.ghost-button {
  background: transparent;
  color: var(--muted);
  border-color: var(--line);
}

.ghost-button:disabled {
  cursor: not-allowed;
  opacity: 0.45;
}

.copy-status {
  min-height: 24px;
  color: var(--muted);
  font-size: 0.92rem;
}

@media (max-width: 860px) {
  .app-shell {
    grid-template-columns: 1fr;
    align-items: start;
    padding: 18px 0;
  }

  .intro-panel,
  .quiz-panel {
    min-height: auto;
  }

  .intro-panel {
    padding: 24px;
  }

  h1 {
    margin-top: 34px;
  }

  .lab-visual {
    min-height: 220px;
  }

  .quiz-panel {
    padding: 24px;
  }
}

@media (max-width: 520px) {
  .app-shell {
    width: min(100% - 20px, 1120px);
  }

  .quick-stats {
    grid-template-columns: 1fr;
  }

  .quiz-topline,
  .action-row {
    flex-direction: column;
  }

  .option-button {
    grid-template-columns: 30px 1fr;
    padding: 15px;
  }

  .option-key {
    width: 30px;
    height: 30px;
  }

  .score-row {
    grid-template-columns: 74px 1fr;
    font-size: 0.9rem;
  }

  .screen {
    width: 112px;
  }
}

    </style>
  </head>
  <body>
    <main class="app-shell">
      <section class="intro-panel" aria-label="课题组人格测评">
        <div class="brand-row">
          <span class="brand-mark" aria-hidden="true">QD</span>
          <span>Lab Personality Test</span>
        </div>
        <h1>课题组人格测评</h1>
        <p class="lead">
          从量子点实验、超净间体质、文献习惯、组会表达和组内生活，测出你在课题组里的隐藏科研偏好。
        </p>
        <div class="lab-visual" aria-hidden="true">
          <div class="bench">
            <span class="flask flask-a"></span>
            <span class="flask flask-b"></span>
            <span class="screen">
              <i></i>
              <i></i>
              <i></i>
            </span>
          </div>
          <div class="chart">
            <span style="height: 34%"></span>
            <span style="height: 68%"></span>
            <span style="height: 46%"></span>
            <span style="height: 82%"></span>
          </div>
        </div>
        <div class="quick-stats">
          <span><b>21</b> 题</span>
          <span><b>12</b> 维度</span>
          <span><b>爆梗</b> 结果</span>
        </div>
      </section>

      <section class="quiz-panel" aria-live="polite">
        <div id="quiz-view">
          <div class="quiz-topline">
            <span id="step-label">第 1 / 10 题</span>
            <span id="axis-label">组会雷达</span>
          </div>
          <div class="progress-track" aria-hidden="true">
            <span id="progress-bar"></span>
          </div>
          <h2 id="question-title"></h2>
          <div id="option-list" class="option-list"></div>
          <div class="quiz-actions">
            <button id="prev-question" class="ghost-button" type="button">上一题</button>
          </div>
        </div>

        <div id="result-view" class="result-view hidden">
          <p class="result-kicker">你的课题组人格是</p>
          <h2 id="result-title"></h2>
          <p id="result-summary" class="result-summary"></p>
          <div id="result-detail" class="result-detail"></div>
          <div id="badge-list" class="badge-list"></div>
          <div id="score-grid" class="score-grid"></div>
          <div class="action-row">
            <button id="edit-last" class="secondary-button" type="button">修改上一题</button>
            <button id="copy-result" class="secondary-button" type="button">复制结果</button>
            <button id="restart-quiz" class="primary-button" type="button">再测一次</button>
          </div>
          <p id="copy-status" class="copy-status" role="status"></p>
        </div>
      </section>
    </main>

    <script>
const dimensions = {
  meeting: { label: "组会表达", color: "#3764b7" },
  experiment: { label: "实验韧性", color: "#2d9c7b" },
  cleanroom: { label: "超净间体质", color: "#8a63b8" },
  tang: { label: "微笑稳态", color: "#dc6b55" },
  literature: { label: "文献内驱", color: "#6f8f2f" },
  life: { label: "组内适配", color: "#d07a33" },
  project: { label: "任务推进", color: "#2f7f93" },
  efficiency: { label: "效率洁癖", color: "#455a64" },
  tolerance: { label: "同门容错", color: "#c4517f" },
  social: { label: "协作互救", color: "#9b5a2e" },
  intuition: { label: "脑洞联想", color: "#6c5ce7" },
  planning: { label: "DDL计划", color: "#b8872d" }
};

const questions = [
  {
    axis: "组内生活",
    title: "如果给现在的课题组生活打一个体感分，你更像？",
    options: [
      { text: "像在科研主题密室逃脱，累是真的，通关欲也是真的", scores: { life: 4, experiment: 1 } },
      { text: "今天想退组，明天数据一好又觉得本组也不是不行", scores: { life: 2, experiment: 2, tang: 1 } },
      { text: "只要别让组会和实验一起夹击，我愿称之为可持续生活", scores: { life: 3, planning: 2 } },
      { text: "我主打长期持有：论文、技能、同门感情都算资产", scores: { literature: 2, social: 2, life: 1 } }
    ]
  },
  {
    axis: "实验频率",
    title: "一周来做实验的次数，更接近你的哪种状态？",
    options: [
      { text: "样品一召唤我就上线，主打一个实验室 NPC 常驻", scores: { experiment: 4, cleanroom: 2 } },
      { text: "按计划出勤，少跑空趟，拒绝无效打卡，栓Q", scores: { planning: 3, experiment: 3 } },
      { text: "看样品脸色加场，今天它不做人，我也只能陪它发疯", scores: { project: 3, experiment: 2 } },
      { text: "集中爆肝几天，然后回去读文献回血，科研版充放电循环", scores: { literature: 3, efficiency: 2 } }
    ]
  },
  {
    axis: "文献习惯",
    title: "一周私下读论文的次数，更像哪种？",
    options: [
      { text: "经常读，看到妙招就收藏，像在囤科研皮肤", scores: { literature: 4, intuition: 2 } },
      { text: "实验一卡住就开始搜，属于被样品逼成文献猎人", scores: { literature: 3, experiment: 3 } },
      { text: "组会前读得最猛，临时抱佛脚但佛祖是 Web of Science", scores: { meeting: 3, literature: 2 } },
      { text: "读得不多但会做笔记，主打给未来的自己递纸条", scores: { efficiency: 3, literature: 2 } }
    ]
  },
  {
    axis: "不怕语录",
    title: "老唐说“不怕的不怕的”，你更容易进入哪种状态？",
    options: [
      { text: "真的会心安一点，至少先把情绪稳住", scores: { tang: 4, life: 1 } },
      { text: "我懂，这是口头禅，不代表变量真的会自己变乖", scores: { experiment: 3, efficiency: 2 } },
      { text: "我就知道你会说这个，于是默默打开记录本", scores: { tang: 2, planning: 3 } },
      { text: "先不怕，再复盘；精神鼓励和对照实验都要有", scores: { experiment: 3, tang: 2 } }
    ]
  },
  {
    axis: "I/E 点名",
    title: "组会上老唐突然点名问你怎么看，你第一秒更像？",
    options: [
      { text: "终于到我发挥了，麦克风请递给本组嘴替", scores: { meeting: 4, social: 1 } },
      { text: "先停两秒，在脑子里排好逻辑再回答", scores: { planning: 3, meeting: 2 } },
      { text: "如果刚好懂，我会补充；不懂就诚实说需要确认", scores: { tolerance: 2, efficiency: 2 } },
      { text: "内心弹窗：怎么是我，但表面还是稳定接球", scores: { tang: 3, meeting: 1 } }
    ]
  },
  {
    axis: "电话长线",
    title: "老唐的会前电话进入长线模式，大家都在等，你通常？",
    options: [
      { text: "太好了，短暂摸鱼窗口，先让大脑加载一下", scores: { life: 3, tang: 1 } },
      { text: "趁机看看图有没有美感，能不能得到科研美图秀秀掌门人的认可", scores: { meeting: 2, intuition: 3 } },
      { text: "打开待办：有没有 DDL 可以趁这几分钟救一下", scores: { planning: 4, efficiency: 2 } },
      { text: "顺手确认文件、投屏、数据版本，别等开会再手忙脚乱", scores: { efficiency: 3, social: 2 } }
    ]
  },
  {
    axis: "师门校准",
    title: "如果你发现老唐某个分析逻辑可能有点问题，你会？",
    options: [
      { text: "沉默不语，自己知道就行，心里默默开一个数据小法庭", scores: { tolerance: 3, tang: 2 } },
      { text: "私下把原始数据和文献证据攒齐，主打温和但有锤", scores: { literature: 3, planning: 2 } },
      { text: "组会上轻轻补一句“这里可能还要验证”，像给逻辑贴创可贴", scores: { meeting: 3, efficiency: 2 } },
      { text: "先不站队，把问题拆成实验能回答的小块，别急着开庭", scores: { experiment: 2, tolerance: 2, planning: 2 } }
    ]
  },
  {
    axis: "S/N 现场",
    title: "讨论一个新方向时，你更自然的反应是？",
    options: [
      { text: "先看现有数据，能做再说，别一上来就赛博许愿", scores: { experiment: 3, efficiency: 3 } },
      { text: "先脑洞起飞，万一离谱想法就是论文隐藏款呢", scores: { intuition: 4, literature: 1 } },
      { text: "先查别人有没有翻车，前人栽树，我来避坑", scores: { literature: 4, planning: 1 } },
      { text: "先看能不能接上当前任务节点，别让新方向变成新大饼", scores: { project: 3, planning: 2 } }
    ]
  },
  {
    axis: "成功反应",
    title: "实验终于做出一组漂亮结果，你第一反应是？",
    options: [
      { text: "先复现，能重复的漂亮才是真漂亮，拒绝一次性烟花", scores: { experiment: 4, planning: 2 } },
      { text: "立刻整理图和逻辑，准备在组会优雅开屏", scores: { meeting: 4, experiment: 1 } },
      { text: "回头翻文献：我要给这个结果找一个高级户口", scores: { literature: 4, intuition: 1 } },
      { text: "先发给同门一起爽一下，快乐不扩散等于没做出来", scores: { social: 4, life: 1 } }
    ]
  },
  {
    axis: "失败反应",
    title: "实验连续失败几次后，你更可能？",
    options: [
      { text: "把变量拆开，先找最可能的失败源", scores: { experiment: 4, efficiency: 2 } },
      { text: "读几篇相近体系，看看别人是不是也踩过这个坑", scores: { literature: 4, experiment: 1 } },
      { text: "找同门聊聊，换一个脑子看问题", scores: { social: 3, tolerance: 2 } },
      { text: "允许自己低落一会儿，然后继续做下一组", scores: { tang: 3, life: 2 } }
    ]
  },
  {
    axis: "超净间",
    title: "进超净间前，你最在意什么？",
    options: [
      { text: "想着几点能出来干饭，科研人也需要碳水续命", scores: { life: 4, cleanroom: 1 } },
      { text: "今天风水如何，样品和仪器会不会愿意给我面子", scores: { intuition: 3, tang: 2 } },
      { text: "只想着实验步骤，进去以后人和杂念一起静音", scores: { cleanroom: 4, experiment: 2 } },
      { text: "又是不想进去的一天，但来都来了，做完再说", scores: { tang: 3, cleanroom: 2 } }
    ]
  },
  {
    axis: "同门容错",

const state = {
  index: 0,
  answers: Array(questions.length).fill(null)
};

const quizView = document.querySelector("#quiz-view");
const resultView = document.querySelector("#result-view");
const stepLabel = document.querySelector("#step-label");
const axisLabel = document.querySelector("#axis-label");
const progressBar = document.querySelector("#progress-bar");
const questionTitle = document.querySelector("#question-title");
const optionList = document.querySelector("#option-list");
const prevButton = document.querySelector("#prev-question");
const resultTitle = document.querySelector("#result-title");
const resultSummary = document.querySelector("#result-summary");
const resultDetail = document.querySelector("#result-detail");
const badgeList = document.querySelector("#badge-list");
const scoreGrid = document.querySelector("#score-grid");
const copyStatus = document.querySelector("#copy-status");

function getScores() {
  const scores = Object.fromEntries(Object.keys(dimensions).map((key) => [key, 0]));

  state.answers.forEach((answer) => {
    if (!answer) {
      return;
    }

    Object.entries(answer.scores).forEach(([key, value]) => {
      scores[key] += value;
    });
  });

  return scores;
}

function renderQuestion() {
  const question = questions[state.index];
  const selectedAnswer = state.answers[state.index];

  stepLabel.textContent = `第 ${state.index + 1} / ${questions.length} 题`;
  axisLabel.textContent = question.axis;
  progressBar.style.width = `${((state.index + 1) / questions.length) * 100}%`;
  questionTitle.textContent = question.title;
  prevButton.disabled = state.index === 0;
  optionList.innerHTML = "";

  question.options.forEach((option, optionIndex) => {
    const button = document.createElement("button");
    button.className = "option-button";
    button.type = "button";
    if (selectedAnswer === option) {
      button.classList.add("selected");
    }
    button.innerHTML = `
      <span class="option-key">${String.fromCharCode(65 + optionIndex)}</span>
      <span class="option-text">${option.text}</span>
    `;
    button.addEventListener("click", () => chooseOption(option));
    optionList.appendChild(button);
  });
}

function chooseOption(option) {
  state.answers[state.index] = option;

  if (state.index < questions.length - 1) {
    state.index += 1;
    renderQuestion();
    return;
  }

  renderResult();
}

function goBack() {
  if (state.index === 0) {
    return;
  }

  state.index -= 1;
  renderQuestion();
}

function getTypeProfile(scores) {
  const axisScores = {
    energy: {
      left: scores.meeting + scores.social + scores.project + scores.tolerance,
      right: scores.literature + scores.life + scores.cleanroom + scores.tang
    },
    info: {
      left: scores.experiment + scores.cleanroom + scores.efficiency + scores.planning,
      right: scores.intuition + scores.literature + scores.meeting + Math.round(scores.life / 2)
    },
    work: {
      left: scores.planning + scores.efficiency + scores.project + scores.cleanroom,
      right: scores.intuition + scores.tang + scores.life + scores.social
    }
  };

  const picks = {
    energy: axisScores.energy.left >= axisScores.energy.right ? "left" : "right",
    info: axisScores.info.left >= axisScores.info.right ? "left" : "right",
    work: axisScores.work.left >= axisScores.work.right ? "left" : "right"
  };
  const code = `${typeAxes.energy[picks.energy].code}${typeAxes.info[picks.info].code}${typeAxes.work[picks.work].code}`;

  return {
    code,
    axisScores,
    picks,
    labels: [
      typeAxes.energy[picks.energy].label,
      typeAxes.info[picks.info].label,
      typeAxes.work[picks.work].label
    ]
  };
}

function getResult(scores) {
  const profile = getTypeProfile(scores);
  const result = typeResults[profile.code] || typeResults.ISJ;

  return {
    ...result,
    code: profile.code,
    profile
  };
}

function getAnswerByAxis(axis) {
  const questionIndex = questions.findIndex((question) => question.axis === axis);
  return questionIndex >= 0 ? state.answers[questionIndex] : null;
}

function buildResultDetails(scores, rankedScores, result) {
  const topLabels = rankedScores
    .slice(0, 3)
    .map(([key]) => dimensions[key].label)
    .join(" / ");
  const lifeAnswer = getAnswerByAxis("组内生活");
  const cleanroomAnswer = getAnswerByAxis("超净间");
  const ddlAnswer = getAnswerByAxis("P/J DDL");
  const tangAnswer = getAnswerByAxis("不怕语录");
  const seniorAnswer = getAnswerByAxis("师兄师姐");
  const errorAnswer = getAnswerByAxis("师门校准");
  const axisText = result.profile.labels.join(" + ");
  const detailItems = [
    `你的三轴代码是 ${result.code}：${axisText}。翻译成人话就是：你在课题组里不是随机刷新，而是有一套稳定的科研操作系统。`,
    `你的突出副属性是：${topLabels}。这些是你人格结果里的隐藏装备，不是主称号，但很影响你平时怎么做实验、开组会和赶 DDL。`
  ];

  if (lifeAnswer) {
    detailItems.push(`组内生活你选了“${lifeAnswer.text}”。这说明你不是单纯喊累，你是在认真判断：这份科研生活我到底能不能长期持有。`);
  }

  if (cleanroomAnswer) {
    detailItems.push(`超净间你选了“${cleanroomAnswer.text}”。很好，进门前的精神状态已经暴露：有的人想实验，有的人想干饭，有的人只想栓Q。`);
  }

  if (ddlAnswer) {
    detailItems.push(`DDL 题你选了“${ddlAnswer.text}”。你的赶工风格基本写在脸上：要么提前排兵布阵，要么和 deadline 极限暧昧拉扯。`);
  }

  if (tangAnswer) {
    detailItems.push(`听到“不怕的不怕的”时，你选了“${tangAnswer.text}”。说明你已经掌握本组语音包的正确打开方式：可以心安，但不能真的开摆。`);
  }

  if (seniorAnswer) {
    detailItems.push(`师兄师姐题你选了“${seniorAnswer.text}”。你对他们的态度很明显：是离不开、跟着长大、舍不得，还是已经在练习单飞。`);
  }

  if (errorAnswer) {
    detailItems.push(`当分析逻辑可能有 bug 时，你选了“${errorAnswer.text}”。这题很关键，因为它暴露了你是沉默型懂哥，还是温和补刀型科研人。`);
  }

  detailItems.push(`${result.teacherLine}总结一下：你不是普通学生，你是老唐科研生态位里的“${result.title}”。请合理使用这份人设，别拿去申请经费。`);

  return detailItems;
}

function renderResult() {
  const scores = getScores();
  const result = getResult(scores);
  const maxScore = Math.max(...Object.values(scores), 1);
  const rankedScores = Object.entries(scores).sort((a, b) => b[1] - a[1]);

  quizView.classList.add("hidden");
  resultView.classList.remove("hidden");
  resultTitle.textContent = result.title;
  resultSummary.textContent = result.summary;
  resultDetail.innerHTML = "";
  buildResultDetails(scores, rankedScores, result).forEach((detail) => {
    const item = document.createElement("p");
    item.textContent = detail;
    resultDetail.appendChild(item);
  });
  badgeList.innerHTML = "";
  [`${result.code} 型`, ...result.profile.labels, ...result.badges].forEach((badge) => {
    const item = document.createElement("span");
    item.textContent = badge;
    badgeList.appendChild(item);
  });

  scoreGrid.innerHTML = "";
  rankedScores.forEach(([key, value]) => {
    const row = document.createElement("div");
    row.className = "score-row";
    row.innerHTML = `
      <span>${dimensions[key].label}</span>
      <div class="score-line"><i style="width: ${Math.max(8, Math.round((value / maxScore) * 100))}%; background: ${dimensions[key].color}"></i></div>
    `;
    scoreGrid.appendChild(row);
  });

  copyStatus.textContent = "";
}

function restartQuiz() {
  state.index = 0;
  state.answers = Array(questions.length).fill(null);
  resultView.classList.add("hidden");
  quizView.classList.remove("hidden");
  renderQuestion();
}

function editLastQuestion() {
  state.index = questions.length - 1;
  resultView.classList.add("hidden");
  quizView.classList.remove("hidden");
  renderQuestion();
}

async function copyResult() {
  const text = `我的课题组人格是「${resultTitle.textContent}」：${resultSummary.textContent}`;

  try {
    await navigator.clipboard.writeText(text);
    copyStatus.textContent = "已复制，可以发给同门精准互测。";
  } catch {
    copyStatus.textContent = text;
  }
}

prevButton.addEventListener("click", goBack);
document.querySelector("#edit-last").addEventListener("click", editLastQuestion);
document.querySelector("#restart-quiz").addEventListener("click", restartQuiz);
document.querySelector("#copy-result").addEventListener("click", copyResult);

renderQuestion();

    </script>
