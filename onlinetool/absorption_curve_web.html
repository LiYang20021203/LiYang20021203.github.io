<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>吸收曲线绘图工具</title>
  <meta name="description" content="上传吸收光谱数据，裁剪波长范围，绘制吸收曲线，分析峰值，并导出 PNG 或 PDF。">
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8f8;
      --paper: #ffffff;
      --ink: #142027;
      --muted: #62717a;
      --line: #d9e2e4;
      --line-strong: #b9c8cd;
      --primary: #28695d;
      --primary-dark: #1f544a;
      --soft: #e8f0ee;
      --warn: #9a5638;
      --shadow: 0 8px 24px rgba(24, 45, 51, 0.08);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(300px, 380px) minmax(0, 1fr);
    }

    aside {
      background: var(--paper);
      border-right: 1px solid var(--line);
      padding: 22px;
      overflow: auto;
    }

    main {
      padding: 22px;
      min-width: 0;
      display: grid;
      grid-template-rows: auto minmax(360px, 1fr) auto;
      gap: 16px;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 22px;
      letter-spacing: 0;
    }

    h2 {
      margin: 22px 0 10px;
      font-size: 15px;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .field {
      display: grid;
      gap: 7px;
      margin: 14px 0;
    }

    label {
      color: var(--muted);
      font-size: 13px;
    }

    input[type="text"],
    input[type="number"],
    select {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 7px;
      padding: 9px 10px;
      min-height: 38px;
    }

    input[type="color"] {
      width: 38px;
      height: 32px;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 3px;
      background: #fff;
      cursor: pointer;
    }

    input[type="file"] {
      width: 100%;
      border: 1px dashed var(--line-strong);
      border-radius: 8px;
      padding: 13px;
      background: #fbfcfc;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 14px;
    }

    button {
      border: 1px solid var(--line-strong);
      background: #fff;
      color: var(--ink);
      border-radius: 7px;
      padding: 9px 12px;
      cursor: pointer;
      min-height: 38px;
    }

    button.primary {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    button.primary:hover {
      background: var(--primary-dark);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .plot-shell {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      min-height: 360px;
      padding: 16px;
      position: relative;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 420px;
    }

    .empty {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--muted);
      padding: 32px;
      pointer-events: none;
    }

    .curve-list {
      display: grid;
      gap: 10px;
    }

    .curve-item {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      display: grid;
      gap: 9px;
    }

    .curve-head {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 8px;
    }

    .swatch {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      border: 1px solid rgba(0, 0, 0, 0.12);
    }

    .curve-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 600;
    }

    .mini {
      padding: 5px 8px;
      min-height: 30px;
      font-size: 12px;
    }

    .style-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .color-row {
      display: grid;
      grid-template-columns: 38px 1fr;
      gap: 8px;
      align-items: center;
    }

    .curve-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .analysis {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
      font-size: 13px;
    }

    th,
    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    th {
      color: var(--muted);
      background: #fbfcfc;
      font-weight: 600;
      white-space: nowrap;
    }

    .note {
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .warning {
      color: var(--warn);
    }

    @media (max-width: 920px) {
      .app {
        grid-template-columns: 1fr;
      }

      aside {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      main {
        padding: 14px;
      }

      canvas {
        min-height: 360px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <h1>吸收曲线绘图工具</h1>
      <p>导入 XLSX、XLS、TXT、CSV 或 DAT 光谱数据，自动识别前两列数值作为波长和吸收强度。</p>

      <div class="field">
        <label for="files">光谱数据文件</label>
        <input id="files" type="file" accept=".xlsx,.xls,.txt,.csv,.dat,.tsv,.asc" multiple>
      </div>

      <div class="field">
        <label for="title">图标题</label>
        <input id="title" type="text" value="Absorption spectra">
      </div>

      <div class="row">
        <div class="field">
          <label for="xLabel">横轴</label>
          <input id="xLabel" type="text" value="Wavelength (nm)">
        </div>
        <div class="field">
          <label for="yLabel">纵轴</label>
          <input id="yLabel" type="text" value="Absorbance (a.u.)">
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label for="globalMin">统一最小波长</label>
          <input id="globalMin" type="number" placeholder="自动">
        </div>
        <div class="field">
          <label for="globalMax">统一最大波长</label>
          <input id="globalMax" type="number" placeholder="自动">
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label for="normalize">归一化</label>
          <select id="normalize">
            <option value="none">不归一化</option>
            <option value="max">按最大值归一化</option>
            <option value="minmax">按 0-1 归一化</option>
          </select>
        </div>
        <div class="field">
          <label for="smooth">平滑窗口</label>
          <select id="smooth">
            <option value="1">不平滑</option>
            <option value="3">3 点</option>
            <option value="5">5 点</option>
            <option value="9">9 点</option>
            <option value="15">15 点</option>
          </select>
        </div>
      </div>

      <div class="actions">
        <button class="primary" id="replot">重新绘图</button>
        <button id="clear">清空</button>
        <button id="png" disabled>导出 PNG</button>
        <button id="pdf" disabled>导出 PDF</button>
      </div>

      <h2>导出样式</h2>
      <div class="style-grid">
        <div class="field">
          <label for="backgroundColor">背景色</label>
          <div class="color-row">
            <input id="backgroundColor" type="color" value="#ffffff">
            <span>画布背景</span>
          </div>
        </div>
        <div class="field">
          <label for="gridColor">网格色</label>
          <div class="color-row">
            <input id="gridColor" type="color" value="#edf2f3">
            <span>辅助线颜色</span>
          </div>
        </div>
        <div class="field">
          <label for="titleSize">标题字号</label>
          <input id="titleSize" type="number" min="10" max="48" value="18">
        </div>
        <div class="field">
          <label for="labelSize">坐标轴字号</label>
          <input id="labelSize" type="number" min="8" max="36" value="14">
        </div>
        <div class="field">
          <label for="tickSize">刻度字号</label>
          <input id="tickSize" type="number" min="8" max="28" value="12">
        </div>
        <div class="field">
          <label for="legendSize">图例字号</label>
          <input id="legendSize" type="number" min="8" max="28" value="12">
        </div>
        <div class="field">
          <label for="lineWidth">曲线线宽</label>
          <input id="lineWidth" type="number" min="0.5" max="8" step="0.5" value="2.2">
        </div>
        <div class="field">
          <label for="pointRadius">峰值点大小</label>
          <input id="pointRadius" type="number" min="0" max="12" step="1" value="4">
        </div>
      </div>

      <h2>曲线范围</h2>
      <div id="curveList" class="curve-list"></div>
      <div class="note">每条曲线可以单独设置裁剪区间；留空表示使用原始范围。峰位会基于裁剪后的数据重新计算。</div>
    </aside>

    <main>
      <div class="plot-shell">
        <canvas id="plot" width="1200" height="720"></canvas>
        <div id="empty" class="empty">上传光谱文件后会在这里显示曲线。</div>
      </div>

      <section class="analysis">
        <table>
          <thead>
            <tr>
              <th>曲线</th>
              <th>点数</th>
              <th>波长范围 / nm</th>
              <th>峰位 / nm</th>
              <th>峰值</th>
              <th>谷值</th>
              <th>峰谷比</th>
            </tr>
          </thead>
          <tbody id="analysisBody">
            <tr><td colspan="7">暂无数据</td></tr>
          </tbody>
        </table>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script>
    const palette = [
      "#28695d", "#537c91", "#b9785f", "#5b6f45", "#8a5b73",
      "#3f6c99", "#ad7b2f", "#6a6f7a", "#27807a", "#884b3a"
    ];

    const state = {
      curves: [],
      rendered: []
    };

    const els = {
      files: document.getElementById("files"),
      title: document.getElementById("title"),
      xLabel: document.getElementById("xLabel"),
      yLabel: document.getElementById("yLabel"),
      globalMin: document.getElementById("globalMin"),
      globalMax: document.getElementById("globalMax"),
      normalize: document.getElementById("normalize"),
      smooth: document.getElementById("smooth"),
      replot: document.getElementById("replot"),
      clear: document.getElementById("clear"),
      png: document.getElementById("png"),
      pdf: document.getElementById("pdf"),
      backgroundColor: document.getElementById("backgroundColor"),
      gridColor: document.getElementById("gridColor"),
      titleSize: document.getElementById("titleSize"),
      labelSize: document.getElementById("labelSize"),
      tickSize: document.getElementById("tickSize"),
      legendSize: document.getElementById("legendSize"),
      lineWidth: document.getElementById("lineWidth"),
      pointRadius: document.getElementById("pointRadius"),
      plot: document.getElementById("plot"),
      empty: document.getElementById("empty"),
      curveList: document.getElementById("curveList"),
      analysisBody: document.getElementById("analysisBody")
    };

    function parseNumber(value) {
      if (value === undefined) return NaN;
      return Number(String(value).trim().replace(",", "."));
    }

    function splitLine(line) {
      const cleaned = line.trim();
      if (!cleaned || cleaned.startsWith("#") || cleaned.startsWith("//")) return [];
      if (cleaned.includes(",")) return cleaned.split(",");
      if (cleaned.includes(";")) return cleaned.split(";");
      if (cleaned.includes("\t")) return cleaned.split("\t");
      return cleaned.split(/\s+/);
    }

    function parseSpectrum(text) {
      const points = [];
      const lines = text.split(/\r?\n/);
      for (const line of lines) {
        const cells = splitLine(line);
        if (cells.length < 2) continue;

        const numericCells = cells.map(parseNumber);
        const xIndex = numericCells.findIndex(Number.isFinite);
        if (xIndex < 0) continue;

        let yIndex = -1;
        for (let i = xIndex + 1; i < numericCells.length; i += 1) {
          if (Number.isFinite(numericCells[i])) {
            yIndex = i;
            break;
          }
        }
        if (yIndex < 0) continue;

        points.push({ x: numericCells[xIndex], y: numericCells[yIndex] });
      }

      points.sort((a, b) => a.x - b.x);
      return points.filter((point, index, arr) => {
        return index === 0 || point.x !== arr[index - 1].x || point.y !== arr[index - 1].y;
      });
    }

    function parseRows(rows) {
      const points = [];

      for (const row of rows) {
        if (!Array.isArray(row) || row.length < 2) continue;
        const numericCells = row.map(parseNumber);
        const xIndex = numericCells.findIndex(Number.isFinite);
        if (xIndex < 0) continue;

        let yIndex = -1;
        for (let i = xIndex + 1; i < numericCells.length; i += 1) {
          if (Number.isFinite(numericCells[i])) {
            yIndex = i;
            break;
          }
        }
        if (yIndex < 0) continue;

        points.push({ x: numericCells[xIndex], y: numericCells[yIndex] });
      }

      points.sort((a, b) => a.x - b.x);
      return points.filter((point, index, arr) => {
        return index === 0 || point.x !== arr[index - 1].x || point.y !== arr[index - 1].y;
      });
    }

    function parseWorkbook(buffer) {
      if (!window.XLSX) {
        throw new Error("XLSX parser is not loaded");
      }

      const workbook = XLSX.read(buffer, { type: "array" });
      const firstSheetName = workbook.SheetNames[0];
      if (!firstSheetName) return [];

      const sheet = workbook.Sheets[firstSheetName];
      const rows = XLSX.utils.sheet_to_json(sheet, {
        header: 1,
        raw: true,
        blankrows: false
      });
      return parseRows(rows);
    }

    function styleNumber(input, fallback) {
      const value = Number(input.value);
      return Number.isFinite(value) ? value : fallback;
    }

    function movingAverage(points, windowSize) {
      if (windowSize <= 1 || points.length < 3) return points;
      const half = Math.floor(windowSize / 2);
      return points.map((point, index) => {
        let sum = 0;
        let count = 0;
        for (let i = index - half; i <= index + half; i += 1) {
          if (i >= 0 && i < points.length) {
            sum += points[i].y;
            count += 1;
          }
        }
        return { x: point.x, y: sum / count };
      });
    }

    function normalizePoints(points, mode) {
      if (mode === "none" || points.length === 0) return points;
      const ys = points.map(point => point.y);
      const min = Math.min(...ys);
      const max = Math.max(...ys);

      if (mode === "max") {
        if (max === 0) return points;
        return points.map(point => ({ x: point.x, y: point.y / max }));
      }

      if (mode === "minmax") {
        const span = max - min;
        if (span === 0) return points;
        return points.map(point => ({ x: point.x, y: (point.y - min) / span }));
      }

      return points;
    }

    function getRangeValue(value) {
      const num = Number(value);
      return Number.isFinite(num) ? num : null;
    }

    function processedCurve(curve) {
      const localMin = getRangeValue(curve.min);
      const localMax = getRangeValue(curve.max);
      const globalMin = getRangeValue(els.globalMin.value);
      const globalMax = getRangeValue(els.globalMax.value);
      const min = localMin ?? globalMin;
      const max = localMax ?? globalMax;

      let points = curve.points.filter(point => {
        if (min !== null && point.x < min) return false;
        if (max !== null && point.x > max) return false;
        return true;
      });

      points = movingAverage(points, Number(els.smooth.value));
      points = normalizePoints(points, els.normalize.value);
      return points;
    }

    function analyze(points) {
      if (points.length === 0) return null;
      let peak = points[0];
      let valley = points[0];

      for (const point of points) {
        if (point.y > peak.y) peak = point;
        if (point.y < valley.y) valley = point;
      }

      const ratio = valley.y === 0 ? null : peak.y / valley.y;
      return {
        count: points.length,
        minX: points[0].x,
        maxX: points[points.length - 1].x,
        peakX: peak.x,
        peakY: peak.y,
        valleyY: valley.y,
        ratio
      };
    }

    function formatNumber(value, digits = 4) {
      if (value === null || value === undefined || !Number.isFinite(value)) return "-";
      const abs = Math.abs(value);
      if (abs >= 1000) return value.toFixed(1);
      if (abs >= 10) return value.toFixed(2);
      return value.toFixed(digits);
    }

    function renderCurveControls() {
      els.curveList.innerHTML = "";
      state.curves.forEach((curve, index) => {
        const item = document.createElement("div");
        item.className = "curve-item";
        item.innerHTML = `
          <div class="curve-head">
            <input type="color" value="${curve.color}" aria-label="曲线颜色">
            <input type="text" value="${escapeHtml(curve.name)}" aria-label="曲线名称">
            <button class="mini" type="button">删除</button>
          </div>
          <div class="curve-grid">
            <div>
              <label>最小波长</label>
              <input type="number" placeholder="${formatNumber(curve.rawMin, 1)}" value="${curve.min}">
            </div>
            <div>
              <label>最大波长</label>
              <input type="number" placeholder="${formatNumber(curve.rawMax, 1)}" value="${curve.max}">
            </div>
          </div>
        `;

        const [colorInput, nameInput, minInput, maxInput] = item.querySelectorAll("input");
        const deleteButton = item.querySelector("button");

        colorInput.addEventListener("input", () => {
          curve.color = colorInput.value;
          draw();
        });
        nameInput.addEventListener("input", () => {
          curve.name = nameInput.value || `Curve ${index + 1}`;
          draw();
        });
        minInput.addEventListener("input", () => {
          curve.min = minInput.value;
          draw();
        });
        maxInput.addEventListener("input", () => {
          curve.max = maxInput.value;
          draw();
        });
        deleteButton.addEventListener("click", () => {
          state.curves.splice(index, 1);
          renderCurveControls();
          draw();
        });

        els.curveList.appendChild(item);
      });
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function fitCanvasToDisplay(canvas) {
      const rect = canvas.getBoundingClientRect();
      const scale = window.devicePixelRatio || 1;
      const width = Math.max(800, Math.floor(rect.width * scale));
      const height = Math.max(480, Math.floor(rect.height * scale));
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }
      return scale;
    }

    function draw() {
      const canvas = els.plot;
      const scale = fitCanvasToDisplay(canvas);
      const ctx = canvas.getContext("2d");
      const width = canvas.width;
      const height = canvas.height;
      const margin = {
        left: 78 * scale,
        right: 34 * scale,
        top: 68 * scale,
        bottom: 78 * scale
      };

      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = els.backgroundColor.value || "#ffffff";
      ctx.fillRect(0, 0, width, height);

      state.rendered = state.curves.map(curve => ({
        curve,
        points: processedCurve(curve)
      })).filter(item => item.points.length >= 2);

      els.empty.style.display = state.rendered.length ? "none" : "grid";
      els.png.disabled = state.rendered.length === 0;
      els.pdf.disabled = state.rendered.length === 0;

      if (state.rendered.length === 0) {
        renderAnalysis();
        return;
      }

      const allPoints = state.rendered.flatMap(item => item.points);
      let minX = Math.min(...allPoints.map(point => point.x));
      let maxX = Math.max(...allPoints.map(point => point.x));
      let minY = Math.min(...allPoints.map(point => point.y));
      let maxY = Math.max(...allPoints.map(point => point.y));

      if (minX === maxX) maxX += 1;
      if (minY === maxY) maxY += 1;
      const yPad = (maxY - minY) * 0.08;
      minY -= yPad;
      maxY += yPad;

      const plotW = width - margin.left - margin.right;
      const plotH = height - margin.top - margin.bottom;
      const xScale = value => margin.left + ((value - minX) / (maxX - minX)) * plotW;
      const yScale = value => margin.top + plotH - ((value - minY) / (maxY - minY)) * plotH;

      drawGrid(ctx, margin, width, height, minX, maxX, minY, maxY, xScale, yScale, scale);
      drawLabels(ctx, margin, width, height, scale);

      for (const item of state.rendered) {
        ctx.beginPath();
        ctx.lineWidth = styleNumber(els.lineWidth, 2.2) * scale;
        ctx.strokeStyle = item.curve.color;
        item.points.forEach((point, index) => {
          const x = xScale(point.x);
          const y = yScale(point.y);
          if (index === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.stroke();

        const stats = analyze(item.points);
        const radius = styleNumber(els.pointRadius, 4);
        if (stats && radius > 0) {
          ctx.fillStyle = item.curve.color;
          ctx.beginPath();
          ctx.arc(xScale(stats.peakX), yScale(stats.peakY), radius * scale, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      drawLegend(ctx, width, margin, scale);
      renderAnalysis();
    }

    function drawGrid(ctx, margin, width, height, minX, maxX, minY, maxY, xScale, yScale, scale) {
      const plotW = width - margin.left - margin.right;
      const plotH = height - margin.top - margin.bottom;

      ctx.strokeStyle = "#d9e2e4";
      ctx.lineWidth = 1 * scale;
      ctx.strokeRect(margin.left, margin.top, plotW, plotH);

      ctx.font = `${styleNumber(els.tickSize, 12) * scale}px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif`;
      ctx.fillStyle = "#62717a";
      ctx.textAlign = "center";
      ctx.textBaseline = "top";

      for (let i = 0; i <= 5; i += 1) {
        const xValue = minX + ((maxX - minX) * i) / 5;
        const x = xScale(xValue);
        ctx.strokeStyle = i === 0 || i === 5 ? "#b9c8cd" : els.gridColor.value;
        ctx.beginPath();
        ctx.moveTo(x, margin.top);
        ctx.lineTo(x, height - margin.bottom);
        ctx.stroke();
        ctx.fillText(formatNumber(xValue, 1), x, height - margin.bottom + 10 * scale);
      }

      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      for (let i = 0; i <= 5; i += 1) {
        const yValue = minY + ((maxY - minY) * i) / 5;
        const y = yScale(yValue);
        ctx.strokeStyle = i === 0 || i === 5 ? "#b9c8cd" : els.gridColor.value;
        ctx.beginPath();
        ctx.moveTo(margin.left, y);
        ctx.lineTo(width - margin.right, y);
        ctx.stroke();
        ctx.fillText(formatNumber(yValue, 3), margin.left - 10 * scale, y);
      }
    }

    function drawLabels(ctx, margin, width, height, scale) {
      ctx.fillStyle = "#142027";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = `600 ${styleNumber(els.titleSize, 18) * scale}px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif`;
      ctx.fillText(els.title.value || "Absorption spectra", width / 2, 30 * scale);

      ctx.font = `${styleNumber(els.labelSize, 14) * scale}px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif`;
      ctx.fillText(els.xLabel.value || "Wavelength (nm)", width / 2, height - 24 * scale);

      ctx.save();
      ctx.translate(24 * scale, height / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.fillText(els.yLabel.value || "Absorbance (a.u.)", 0, 0);
      ctx.restore();
    }

    function drawLegend(ctx, width, margin, scale) {
      const x = width - margin.right - 180 * scale;
      let y = margin.top + 14 * scale;

      ctx.font = `${styleNumber(els.legendSize, 12) * scale}px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif`;
      ctx.textBaseline = "middle";
      ctx.textAlign = "left";

      state.rendered.forEach(item => {
        ctx.strokeStyle = item.curve.color;
        ctx.lineWidth = 3 * scale;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + 24 * scale, y);
        ctx.stroke();

        ctx.fillStyle = "#142027";
        const name = item.curve.name.length > 24 ? `${item.curve.name.slice(0, 23)}...` : item.curve.name;
        ctx.fillText(name, x + 32 * scale, y);
        y += (styleNumber(els.legendSize, 12) + 8) * scale;
      });
    }

    function renderAnalysis() {
      if (!state.rendered.length) {
        els.analysisBody.innerHTML = `<tr><td colspan="7">暂无数据</td></tr>`;
        return;
      }

      els.analysisBody.innerHTML = state.rendered.map(item => {
        const stats = analyze(item.points);
        if (!stats) {
          return `<tr><td>${escapeHtml(item.curve.name)}</td><td colspan="6" class="warning">裁剪后没有有效数据</td></tr>`;
        }

        return `
          <tr>
            <td>${escapeHtml(item.curve.name)}</td>
            <td>${stats.count}</td>
            <td>${formatNumber(stats.minX, 1)} - ${formatNumber(stats.maxX, 1)}</td>
            <td>${formatNumber(stats.peakX, 2)}</td>
            <td>${formatNumber(stats.peakY, 5)}</td>
            <td>${formatNumber(stats.valleyY, 5)}</td>
            <td>${formatNumber(stats.ratio, 4)}</td>
          </tr>
        `;
      }).join("");
    }

    function downloadDataUrl(dataUrl, filename) {
      const link = document.createElement("a");
      link.href = dataUrl;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
    }

    function exportPng() {
      draw();
      downloadDataUrl(els.plot.toDataURL("image/png"), "absorption_curves.png");
    }

    function exportPdf() {
      draw();
      const jsPDF = window.jspdf && window.jspdf.jsPDF;
      if (!jsPDF) {
        window.print();
        return;
      }

      const canvas = els.plot;
      const pdf = new jsPDF({
        orientation: "landscape",
        unit: "pt",
        format: "a4"
      });
      const pageW = pdf.internal.pageSize.getWidth();
      const pageH = pdf.internal.pageSize.getHeight();
      const margin = 28;
      const imgW = pageW - margin * 2;
      const imgH = imgW * (canvas.height / canvas.width);
      const y = Math.max(margin, (pageH - imgH) / 2);
      pdf.addImage(canvas.toDataURL("image/png"), "PNG", margin, y, imgW, imgH);
      pdf.save("absorption_curves.pdf");
    }

    function clearAll() {
      state.curves = [];
      els.files.value = "";
      renderCurveControls();
      draw();
    }

    async function handleFiles(event) {
      const files = Array.from(event.target.files || []);
      if (!files.length) return;

      const loaded = await Promise.all(files.map(file => {
        return new Promise(resolve => {
          const reader = new FileReader();
          const isWorkbook = /\.(xlsx|xls)$/i.test(file.name);
          reader.onload = () => resolve({
            file,
            kind: isWorkbook ? "workbook" : "text",
            data: reader.result
          });
          if (isWorkbook) reader.readAsArrayBuffer(file);
          else reader.readAsText(file);
        });
      }));

      loaded.forEach(({ file, kind, data }) => {
        let points = [];
        try {
          points = kind === "workbook" ? parseWorkbook(data) : parseSpectrum(data);
        } catch (error) {
          console.warn(`Failed to parse ${file.name}`, error);
        }
        if (points.length < 2) return;
        state.curves.push({
          name: file.name.replace(/\.[^.]+$/, ""),
          points,
          rawMin: points[0].x,
          rawMax: points[points.length - 1].x,
          min: "",
          max: "",
          color: palette[state.curves.length % palette.length]
        });
      });

      renderCurveControls();
      draw();
    }

    els.files.addEventListener("change", handleFiles);
    els.replot.addEventListener("click", draw);
    els.clear.addEventListener("click", clearAll);
    els.png.addEventListener("click", exportPng);
    els.pdf.addEventListener("click", exportPdf);
    [
      els.title, els.xLabel, els.yLabel, els.globalMin, els.globalMax,
      els.normalize, els.smooth, els.backgroundColor, els.gridColor,
      els.titleSize, els.labelSize, els.tickSize, els.legendSize,
      els.lineWidth, els.pointRadius
    ].forEach(input => {
      input.addEventListener("input", draw);
      input.addEventListener("change", draw);
    });
    window.addEventListener("resize", draw);
    draw();
  </script>
</body>
</html>
